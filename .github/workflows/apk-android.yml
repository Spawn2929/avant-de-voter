# Fabrique l'APK signé de l'appli « Avant de voter » et le publie dans une « Release » du dépôt.
# Se lance tout seul quand on pousse une étiquette de version (ex. v0.1.0),
# ou à la main depuis l'onglet Actions de GitHub (bouton « Run workflow »).
name: APK Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Copie des données du jour dans l'APK (affichées dès l'installation, même sans réseau)
        run: python pipeline/copie_donnees.py

      - name: Clé de signature
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Tests et fabrication de l'APK signé
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Chaque fabrication porte un numéro plus grand que la précédente : Android accepte la mise à jour.
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionCode=${{ github.run_number }}0 -PversionName="$VERSION"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AvantDeVoter-$VERSION.apk"

      - name: Publication dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/AvantDeVoter-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/AvantDeVoter-$VERSION.apk" \
              --target "$GITHUB_SHA" --title "Avant de voter $VERSION" \
              --notes "APK à installer sur les téléphones (voir GUIDE-INSTALLATION.md, section « Installer les téléphones »)."
          fi
